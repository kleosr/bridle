name: gates

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify AGENTS.md existence
        run: test -f AGENTS.md
      - name: Install jq + shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck
      - name: Cursor install + verify
        run: FORCE=1 bash hosts/cursor/install.sh all
      - name: Tests
        run: bash tests/run.sh

  gauntlet-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify AGENTS.md existence
        run: test -f AGENTS.md
      - name: Install jq + shellcheck
        run: brew install jq shellcheck
      - name: Cursor install + verify (stock macOS bash + BSD userland)
        run: FORCE=1 /bin/bash hosts/cursor/install.sh all
      - name: Tests (stock macOS bash + BSD userland)
        run: /bin/bash tests/run.sh
