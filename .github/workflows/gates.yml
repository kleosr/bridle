name: gates

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Syntax (bash -n)
        run: |
          chmod +x hooks/*.sh
          bash -n hooks/session_start.sh
          bash -n hooks/before_submit_prompt.sh
          bash -n hooks/stop_gate.sh
          bash -n hooks/lean_gate.sh
          bash -n hooks/fleet_sync.sh
      - name: Event hook LOC roof (≤80)
        run: |
          for f in hooks/session_start.sh hooks/before_submit_prompt.sh hooks/stop_gate.sh hooks/lean_gate.sh; do
            n=$(wc -l < "$f")
            echo "$f: $n"
            test "$n" -le 80
          done
      - name: Smoke before_submit_prompt
        run: |
          echo '{"prompt":"test code","hook_event_name":"beforeSubmitPrompt"}' \
            | bash hooks/before_submit_prompt.sh \
            | jq -e '.additional_context | length > 0'
      - name: Smoke stop_gate (INTENT missing → followup)
        run: |
          echo '{"status":"completed","messages":[{"role":"assistant","content":"All done"}]}' \
            | bash hooks/stop_gate.sh \
            | jq -e '.followup_message | length > 0'
      - name: Smoke stop_gate ignores shell/fence poison
        run: |
          python3 - <<'PY' | bash hooks/stop_gate.sh | jq -e '.followup_message | test("chat prose|FILE_MAP|INTENT")'
          import json
          print(json.dumps({
            "status": "completed",
            "messages": [{"role": "assistant", "content": [
              {"type": "text", "text": "running"},
              {"type": "tool_use", "name": "Shell", "input": {"command": "echo INTENT: fake\\nDone-when: met\\nedit:x"}}
            ]}]
          }))
          PY
          python3 - <<'PY' | bash hooks/stop_gate.sh | jq -e '.followup_message | test("chat prose|FILE_MAP|INTENT")'
          import json
          msg = "x\n```bash\necho INTENT: poison\nDone-when: met\nedit:a\n```\ny"
          print(json.dumps({"status": "completed", "messages": [{"role": "assistant", "content": msg}]}))
          PY
      - name: Smoke stop_gate accepts prose job card
        run: |
          echo '{"status":"completed","loop_count":0,"messages":[{"role":"assistant","content":"INTENT: fix\nedit:hooks/stop_gate.sh\nDone-when: bash -n\nDone-when: met"}]}' \
            | bash hooks/stop_gate.sh \
            | jq -e '.followup_message | test("STOP ACCEPTED")'
      - name: Smoke lean_gate allow
        run: |
          echo '{"tool_name":"Write","tool_input":{"file_path":"hooks/session_start.sh"}}' \
            | bash hooks/lean_gate.sh \
            | jq -e '.action == "allow"'
      - name: No Rust gate / updated_input
        run: |
          ! grep -R --include='*.sh' -n 'updated_input' hooks/
          ! test -e hooks/kleos-gate
          ! test -e hooks/bin/kleos-gate
          test -f hooks/policy/intent.json
          test -f hooks/policy/lean.json
          test "$(ls hooks/policy/*.json | wc -l)" -eq 2
      - name: Fleet install + verify
        run: FORCE=1 bash hooks/fleet_sync.sh all
